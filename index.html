    <script>
      // Set the theme before first paint, so a light-mode user never sees a
      // flash of the dark palette while the bundle loads.
      (function () {
        try {
          var t = localStorage.getItem('sentient.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-accent', localStorage.getItem('sentient.accent') || 'lime');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

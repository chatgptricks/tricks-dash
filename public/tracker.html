<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="/mobile-redirect.js?rev=f20263e"></script>
<script src="/role-preview.js?rev=f20263e" defer></script>
<script src="/context-menu.js?v=20260901-context1" defer></script>
<title>Tracker · sentientdash.app</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='54' font-size='84' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" /><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>(function(){try{var t=localStorage.getItem('sentient.theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
/* Google sign-in gate -- Tracker is a standalone static page (not part of the
   React bundle), so it gets its own minimal copy of the same Firebase gate
   instead of sharing App.jsx's. Same pattern as insights.html. */
#authGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000;z-index:999}
#authGate .card{width:100%;max-width:340px;padding:30px 26px;border:1px solid rgba(var(--edge),.1);
  border-radius:8px;background:#0d0d0d;text-align:center}
#authGate h1{margin:0 0 8px;font-size:19px;font-weight:900;color:#f5f5f5}
#authGate p{margin:0 0 18px;color:var(--muted-2);font-size:13px;line-height:1.5}
#authGate button{width:100%;height:34px;border:1px solid rgba(var(--accent-rgb),.5);border-radius:8px;
  background:rgba(var(--accent-rgb),.14);color:var(--text);font-size:12px;font-weight:800;cursor:pointer}
#authGate button:hover{background:rgba(var(--accent-rgb),.22)}
#authGate.hidden{display:none}
:root{
  color-scheme:dark;
  --edge:255,255,255; --ink:245,245,245; --shade:0,0,0; --accent-rgb:245,255,0;
  --bg:#000; --panel:#0b0b0b; --panel-2:#101010; --line:rgba(var(--edge),.09);
  --text:#f5f5f5; --muted:#8a8a8a; --muted-2:#b5b5b5; --accent:#f5ff00; --accent-text:#f5ff00; --accent-ink:#151500;
  --good:#35c759; --warn:#ff9f0a; --hot:#ff6b35; --cool:#4aa8ff;
  --pill-s-fg:#8fc9ff; --pill-s-bg:rgba(74,168,255,.15);
  --pill-c-fg:#ffa480; --pill-c-bg:rgba(255,107,53,.15);
  --pos:#48d18b; --neg:#ff6b6b; --cloud:#9ad34a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* Full width: a 1200px cap left ~350px of dead margin on each side of a
   1920 screen, which squeezed a table that has eight numeric columns
   into the middle third of the display. */
.wrap{max-width:none;margin:0;padding:18px 24px 80px}

/* topbar */
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px}
.brand small{display:block;color:var(--muted);font-size:9px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px}
.brand h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--accent-text)}
.top-actions{display:flex;gap:8px;align-items:center}
.linkbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--muted-2);
  font-size:11px;font-weight:700;text-decoration:none;cursor:pointer}
.linkbtn:hover{border-color:rgba(var(--accent-rgb),.4);color:var(--text)}

/* --- Social Blade-style shell: account rail on the left --------------- */
.tracker-shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.tracker-shell{grid-template-columns:1fr}}

.tracker-sidebar{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;
  padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tracker-sidebar::-webkit-scrollbar{width:6px}
.tracker-sidebar::-webkit-scrollbar-thumb{background:rgba(var(--edge),.14);border-radius:999px}

.side-search input{width:100%;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:7px;
  background:rgba(var(--edge),.03);color:var(--text);font-size:11px;outline:none}
.side-search input:focus{border-color:rgba(var(--accent-rgb),.4)}
.side-search input::-webkit-search-cancel-button{appearance:none}

.side-all{width:100%;margin-top:8px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:transparent;color:var(--muted-strong);font-size:11px;font-weight:700;text-align:left;cursor:pointer}
.side-all:hover,.side-all.active{border-color:rgba(var(--accent-rgb),.35);color:#fff}

.side-group{margin-top:12px}
.side-group h3{display:flex;align-items:center;gap:6px;margin:0 0 5px;padding:0 2px;
  color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.side-group h3 span{color:rgba(var(--ink),.3)}
.side-group ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}

.side-item{display:flex;align-items:center;gap:7px;padding:5px 6px;border:1px solid transparent;
  border-radius:7px;cursor:pointer}
.side-item:hover{background:rgba(var(--edge),.05)}
.side-item.active{border-color:rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.06)}

.side-star{flex:none;padding:0;border:0;background:none;cursor:pointer;font-size:12px;line-height:1;
  color:rgba(var(--edge),.18)}
.side-star:hover{color:rgba(var(--accent-rgb),.6)}
.side-star.on{color:var(--accent-text)}

.side-item[draggable="true"]{cursor:grab}
.side-item.dragging{opacity:.35}
.side-item.drag-over{border-color:rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.08)}

.side-avatar{flex:none;width:22px;height:22px;border-radius:50%;object-fit:cover;background:rgba(var(--edge),.06)}
.side-name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.side-name strong{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-name em{font-style:normal;color:var(--muted);font-size:9px}
.side-delta{flex:none;font-size:10px;font-weight:800}
.side-delta.up{color:var(--pos)}.side-delta.down{color:var(--neg)}.side-delta.flat{color:var(--muted)}

/* Daily change is the headline number; the running total sits to its right,
   deliberately quieter, because it barely moves day to day. */
.hist-daily{font-size:15px;font-weight:800;letter-spacing:-.01em}
.hist-daily.up{color:var(--pos)}.hist-daily.down{color:var(--neg)}.hist-daily.flat{color:var(--muted)}
.hist-total{color:var(--muted-strong);font-size:12px;font-weight:600}
.hist-secondary{opacity:.72}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:16px}
.kpi{padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.kpi b{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:6px}
.kpi strong{font-size:22px;font-weight:800;letter-spacing:-.02em}
.kpi em{display:block;font-style:normal;color:var(--muted);font-size:10px;margin-top:3px}

/* sections */
section{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:16px 18px;margin-bottom:14px}
section>h2{margin:0 0 4px;font-size:14px;font-weight:800;letter-spacing:-.01em}
section>h2 .tag{margin-left:8px;padding:2px 7px;border-radius:999px;background:rgba(var(--accent-rgb),.12);
  color:var(--accent-text);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
section>p.sub{margin:0 0 14px;color:var(--muted);font-size:11px;line-height:1.5}

/* Manual follower-count refresh: a small ghost icon next to the leaderboard
   table's follower cell (many rows, so a full button per row would be
   noisy), and a full linkbtn -- same look as the overview's "Refresh all" --
   for the single-account detail page and the batch action. All three just
   call the same POST endpoints and merge the result back into SUMMARY --
   see refreshAccountNow/refreshAllAccountsNow. */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.section-head h2{margin:0}
.refresh-btn{flex:none}
.followers-cell{display:inline-flex;align-items:center;gap:6px}
.row-refresh-btn{flex:none;padding:0;border:0;background:none;color:rgba(var(--edge),.35);
  font-size:13px;line-height:1;cursor:pointer}
.row-refresh-btn:hover{color:var(--accent-text)}
.row-refresh-btn:disabled,.refresh-btn:disabled{opacity:.5;cursor:default}
.refresh-icon{display:inline-block}
.is-spinning{animation:tspin 900ms linear infinite}
@keyframes tspin{to{transform:rotate(360deg)}}

/* leaderboard table */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:right;padding:8px;color:var(--muted);font-size:9px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
th:first-child{text-align:left}
th.sorted{color:var(--accent-text)}
td{text-align:right;padding:9px 8px;border-bottom:1px solid rgba(var(--edge),.045);white-space:nowrap}
td:first-child{text-align:left}
/* Account cell (avatar + handle) shrink-wraps to its own content width --
   without an explicit left align here, shorter rows (no full name shown,
   or a broken avatar) drift toward the column's right edge instead of
   lining up with wider rows, since td defaults to text-align:right. */
td:nth-child(2){text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(var(--edge),.03)}
.acct-cell{display:flex;align-items:center;gap:9px}
.acct-avatar{width:26px;height:26px;border-radius:999px;object-fit:cover;background:var(--panel-2);flex:0 0 auto}
.acct-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.acct-name strong{font-size:12px;font-weight:700;color:var(--text)}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:9px;font-weight:800;width:fit-content}
.pill.s{background:var(--pill-s-bg);color:var(--pill-s-fg)}
.pill.c{background:var(--pill-c-bg);color:var(--pill-c-fg)}
.delta{font-weight:700}
.delta.up{color:var(--good)}
.delta.down{color:var(--neg)}
.delta.flat{color:var(--muted)}
.na{color:var(--muted)}
.rank-num{color:var(--muted);font-weight:700}

/* charts */
.chartbox{position:relative;height:280px;min-width:0;width:100%}
.chartbox canvas{max-width:100%}

.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.note{margin-top:10px;padding:9px 11px;border-left:2px solid rgba(var(--accent-rgb),.4);
  background:rgba(var(--accent-rgb),.04);color:var(--muted-2);font-size:11px;line-height:1.55;border-radius:0 6px 6px 0}
.note b{color:var(--text)}

/* detail view */
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.detail-head-id{display:flex;align-items:center;gap:12px;min-width:0}
.detail-head img{width:46px;height:46px;border-radius:999px;object-fit:cover;background:var(--panel-2)}
.detail-head h2{margin:0;font-size:17px}
.detail-head-id span{color:var(--muted);font-size:11px}

/* historical stats table (Social-Blade-style day-by-day breakdown) */
table.hist-table{font-size:12px}
table.hist-table th{text-align:left}
table.hist-table th:first-child{width:150px}
table.hist-table td{text-align:left;padding:11px 8px;white-space:nowrap}
.hist-date{font-weight:700;color:var(--text)}
.hist-dow{margin-left:6px;padding:1px 6px;border-radius:5px;background:rgba(var(--edge),.06);
  color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase}
.hist-val{font-weight:700;color:var(--text)}
.hist-pill{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:800}
.hist-pill.up{background:rgba(53,199,89,.16);color:var(--good)}
.hist-pill.down{background:rgba(255,107,107,.16);color:var(--neg)}

/* --- themes -------------------------------------------------------------
   Same channel approach as the dashboard: --edge is the border/hover channel
   and --ink the text channel, so every rgba() call site follows the theme
   without being rewritten one by one. Dark renders exactly as before.
   The neon accent is ~1.1:1 on white, so light gets a darkened amber -- same
   hue, luminance that can actually be read.
   ------------------------------------------------------------------------ */
:root[data-theme='light']{
  color-scheme:light;
  --edge:0,0,0; --ink:20,20,20; --shade:15,23,42; --accent-rgb:195,199,2;
  --bg:#f4f4f5; --panel:#ffffff; --panel-2:#f1f1f2;
  --line:rgba(0,0,0,.12);
  --text:#18181b; --muted:#6b6b70; --muted-2:#3f3f46;
  --accent:#c3c702; --accent-text:#727600; --accent-ink:#2e2f00;
  --good:#137a35; --warn:#8a5a00; --hot:#b8431a; --cool:#1668b8;
  --pill-s-fg:#0b5ea8; --pill-s-bg:rgba(74,168,255,.18);
  --pill-c-fg:#a33c12; --pill-c-bg:rgba(255,107,53,.18);
  --pos:#0f7a3d; --neg:#b3261e; --cloud:#4a6b12;
}
:root[data-theme='light'] #authGate{background:#f4f4f5}
:root[data-theme='light'] #authGate .card{background:#fff}
:root[data-theme='light'] #authGate h1{color:#18181b}
:root[data-theme='light'] #authGate button{background:rgba(122,106,0,.14);color:#3d3600;
  border-color:rgba(122,106,0,.5)}

/* language toggle -- now nested inside the Settings panel below */
.lang-toggle{display:inline-flex;align-items:center;height:32px;padding:2px;
  border:1px solid var(--line);border-radius:8px}
.lang-option{height:26px;padding:0 8px;border:0;border-radius:6px;background:none;
  color:var(--muted);font-size:11px;font-weight:800;font-family:inherit;cursor:pointer}
.lang-option:hover{color:var(--text)}
.lang-option.is-on{background:rgba(var(--edge),.1);color:var(--text)}

/* Settings: one gear-icon entry point (accent, theme, language, admin link,
   sign out) -- same shape repeated across Dashboard/Queue/Tracker/Insights,
   each page implementing it locally since none of them share a bundle. */
:root[data-accent='blue']{--accent-rgb:96,165,250;--accent:#60a5fa;--accent-text:#60a5fa;--accent-ink:#151515}
:root[data-accent='coral']{--accent-rgb:251,113,133;--accent:#fb7185;--accent-text:#fb7185;--accent-ink:#151515}
.settings-menu{position:relative}
.settings-menu-trigger{display:grid;place-items:center;width:32px;height:32px;padding:0;
  overflow:hidden;border:1px solid var(--line);border-radius:50%;background:var(--panel-2);color:var(--muted);
  font-size:11px;font-weight:850;line-height:1;cursor:pointer}
.settings-menu-trigger img{display:block;width:100%;height:100%;object-fit:cover}
.settings-menu-trigger span{display:grid;width:100%;height:100%;place-items:center;background:rgba(var(--accent-rgb),.13);color:var(--text)}
.settings-menu-trigger:hover,.settings-menu-trigger.is-active{border-color:rgba(var(--accent-rgb),.45);color:var(--text)}
.settings-menu-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:60;display:none;gap:2px;
  width:280px;max-height:calc(100dvh - 90px);overflow:auto;padding:6px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel);box-shadow:0 18px 44px rgba(var(--shade),.5)}
.settings-menu-panel.is-open{display:grid}
.settings-menu-section{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px}
.settings-menu-section>span{color:var(--muted);font-size:11px;font-weight:750}
.settings-accent-picker{display:flex;align-items:center;gap:6px}
.settings-accent-picker button{width:18px;height:18px;padding:0;border:1px solid rgba(255,255,255,.35);
  border-radius:50%;cursor:pointer}
.settings-accent-picker button.is-on{box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--accent)}
.settings-accent-picker .accent-green{background:#00ac80}
.settings-accent-picker .accent-lime{background:#f5ff00}
.settings-accent-picker .accent-blue{background:#60a5fa}
.settings-accent-picker .accent-coral{background:#fb7185}
.settings-custom-color{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:9px;font-weight:750;cursor:pointer}
.settings-custom-color input{width:22px;height:22px;padding:0;border:1px solid rgba(var(--edge),.28);border-radius:50%;background:transparent;cursor:pointer;overflow:hidden}
.settings-custom-color input::-webkit-color-swatch-wrapper{padding:0}.settings-custom-color input::-webkit-color-swatch{border:0;border-radius:50%}
.settings-custom-color input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.settings-menu-segment{display:flex;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2)}
.settings-menu-segment button{display:inline-flex;align-items:center;gap:5px;min-height:27px;padding:0 8px;
  border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:10px;font-weight:750;
  font-family:inherit;cursor:pointer}
.settings-menu-segment button.is-on{background:rgba(var(--accent-rgb),.18);color:var(--accent-text)}
.settings-menu-admin{display:none;flex-direction:column;align-items:stretch;gap:8px;margin-top:2px;
  padding-top:11px;border-top:1px solid var(--line)}
.settings-menu-admin.is-visible{display:flex}
.settings-menu-admin>span{font-size:9px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}
.settings-menu-link{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:28px;
  padding:0 8px;border:1px solid rgba(var(--accent-rgb),.32);border-radius:7px;background:rgba(var(--accent-rgb),.08);
  color:var(--accent-text);font-size:11px;font-weight:750;text-decoration:none}
.settings-menu-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;
  padding:10px 8px 6px;border-top:1px solid var(--line)}
.settings-menu-footer small{overflow:hidden;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.settings-menu-signout{display:inline-flex;flex:0 0 auto;align-items:center;gap:5px;min-height:28px;padding:0 8px;
  border:1px solid rgba(255,107,107,.32);border-radius:7px;background:rgba(255,107,107,.08);color:#ff9b9b;
  font-size:10px;font-weight:750;font-family:inherit;cursor:pointer}
:root[data-theme='light'] .settings-menu-signout{color:#9b1c1c}
@media(max-width:620px){.settings-menu-panel{position:fixed;top:auto;right:8px;bottom:8px;left:8px;width:auto;max-height:70dvh}}

.avatar-fallback{display:inline-flex;align-items:center;justify-content:center;
  background:rgba(var(--edge),.1);color:var(--muted-2);font-weight:800;
  font-size:9px;letter-spacing:0;text-transform:uppercase}
</style>
</head>
<body>
<div id="authGate" class="hidden">
  <div class="card">
    <h1>Sentient Tracker</h1>
    <p id="authGateText">Sign in with your Google account to continue.</p>
    <button id="authGateBtn" type="button">Sign in with Google</button>
  </div>
</div>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <small>Sentient</small>
      <h1>Tracker<span>.</span></h1>
    </div>
    <div class="top-actions">
      <div class="settings-menu" id="settingsMenu">
        <button type="button" class="settings-menu-trigger" id="settingsTrigger" aria-label="Settings" aria-expanded="false" title="Settings"><span>?</span></button>
        <div class="settings-menu-panel" id="settingsPanel" role="dialog" aria-label="Settings">
          <div class="settings-menu-section">
            <span data-i18n="Accent color">Accent color</span>
            <div class="settings-accent-picker" id="settingsAccentPicker">
              <button type="button" class="accent-green" data-accent-choice="green" aria-label="green accent"></button>
              <button type="button" class="accent-lime" data-accent-choice="lime" aria-label="lime accent"></button>
              <button type="button" class="accent-blue" data-accent-choice="blue" aria-label="blue accent"></button>
              <button type="button" class="accent-coral" data-accent-choice="coral" aria-label="coral accent"></button>
              <label class="settings-custom-color" title="Custom color"><input type="color" id="settingsCustomColor" aria-label="Custom color"><span>Custom</span></label>
            </div>
          </div>
          <div class="settings-menu-section">
            <span data-i18n="Theme">Theme</span>
            <div class="settings-menu-segment" id="settingsThemeSegment">
              <button type="button" data-theme-choice="dark">🌙 <span data-i18n="Dark">Dark</span></button>
              <button type="button" data-theme-choice="light">☀️ <span data-i18n="Light">Light</span></button>
            </div>
          </div>
          <div class="settings-menu-section">
            <span data-i18n="Language">Language</span>
            <div class="lang-toggle" role="group" aria-label="Language">
              <button type="button" class="lang-option" data-lang="en">ENG</button>
              <button type="button" class="lang-option" data-lang="es">ES</button>
            </div>
          </div>
          <div class="settings-menu-admin" id="settingsAdmin">
            <span>Command center</span>
            <a class="settings-menu-link" href="./settings.html">⚙ <span data-i18n="Settings">Settings</span></a>
          </div>
          <div class="settings-menu-footer">
            <small id="settingsEmail"></small>
            <button type="button" class="settings-menu-signout" id="settingsSignOut">⎋ <span data-i18n="Sign out">Sign out</span></button>
          </div>
        </div>
      </div>
      <button class="linkbtn" id="shareBtn" title="Copy a link to this exact view">Copy link</button>
      <a class="linkbtn" href="./insights.html">Insights</a>
      <a class="linkbtn" href="./queue.html">Queue</a>
      <a class="linkbtn" href="./index.html">← Dashboard</a>
    </div>
  </div>

  <div class="tracker-shell">
    <aside id="sidebar" class="tracker-sidebar"></aside>
    <div id="app"><div class="loading">Loading data…</div></div>
  </div>
</div>

<script>
const API = 'https://cortex-api-db2e.onrender.com';
/* A missing avatar used to set visibility:hidden, which leaves an invisible
   gap -- the row still reserves the space but shows nothing, so it reads as a
   rendering bug rather than "no picture on file". Swap in the initial instead,
   keeping the same circle so the row never shifts. */
function avFail(img, handle){
  const span = document.createElement('span');
  span.className = img.className + ' avatar-fallback';
  span.textContent = (handle || '?').replace(/^@/, '').charAt(0).toUpperCase();
  img.replaceWith(span);
}
const $ = s => document.querySelector(s);
// Abbreviated form is kept only for the chart y-axis (readability at a
// glance); every number a person actually reads as "how many followers"
// uses the exact figure per explicit request -- no rounding to 4.7M.
// PostgreSQL aggregates can reach this static page as numeric strings. Keep
// formatting tolerant at the boundary so one field cannot take down Tracker.
const asNumber = value => {
  if (value === null || value === undefined || value === '') return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
};
const fmtAxis = value => {
  const n = asNumber(value);
  if (n === null) return '—';
  return Math.abs(n)>=1e6 ? (n/1e6).toFixed(1)+'M'
    : Math.abs(n)>=1e3 ? (n/1e3).toFixed(1)+'K' : Math.round(n).toLocaleString('en-US');
};
const fmt = value => {
  const n = asNumber(value);
  return n === null ? '—' : Math.round(n).toLocaleString('en-US');
};
const signed = value => {
  const n = asNumber(value);
  return n === null ? '—' : (n>0?'+':'')+fmt(n);
};
const pct = value => {
  const n = asNumber(value);
  return n === null ? '—' : (n>0?'+':'')+n.toFixed(1)+'%';
};
const dt = s => s ? new Date(s).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : '—';

let SUMMARY = null;
let DETAIL_CACHE = {};
let CHARTS = [];
function destroyCharts(){ CHARTS.forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS=[]; }

Chart.defaults.color='#8a8a8a';
Chart.defaults.font.family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif";
Chart.defaults.font.size=10;
Chart.defaults.borderColor='rgba(var(--edge),.07)';
Chart.defaults.resizeDelay=120;

// ---------------------------------------------------------------------------
// URL state -- same contract as Insights/Dashboard: the query string is the
// only place "which account am I looking at" lives, so a reload or a shared
// link reproduces the exact same view.
// ---------------------------------------------------------------------------
function encodeRoute(state){
  try{
    const bytes=new TextEncoder().encode(JSON.stringify(state||{})); let binary='';
    bytes.forEach(b=>{binary+=String.fromCharCode(b)});
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }catch(e){ return ''; }
}
function decodeRoute(token){
  if(!token) return null;
  try{
    const normalized=String(token).replace(/-/g,'+').replace(/_/g,'/');
    const padded=normalized+'='.repeat((4-(normalized.length%4))%4);
    const binary=atob(padded); const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const value=JSON.parse(new TextDecoder().decode(bytes));
    return value&&typeof value==='object'&&!Array.isArray(value)?value:null;
  }catch(e){ return null; }
}
function readAcc(){ const p=new URLSearchParams(location.search); return decodeRoute(p.get('r'))?.acc || p.get('acc') || ''; }
function writeAcc(handle){
  const qs = handle ? '?r='+encodeURIComponent(encodeRoute({acc:handle})) : '';
  history.pushState(null, '', location.pathname + qs);
}

async function shareLink(){
  const btn=$('#shareBtn');
  try{
    await navigator.clipboard.writeText(location.href);
    btn.textContent='Copied'; setTimeout(()=>{btn.textContent='Copy link'},1600);
  }catch(e){ prompt('Copy this link:', location.href); }
}

async function boot(){
  $('#shareBtn').addEventListener('click', shareLink);
  window.addEventListener('popstate', render);
  try{
    await loadSummary();
    render();
  }catch(e){
    $('#app').innerHTML = '<div class="empty">Could not load the tracker.<br><small>'+e.message+'</small></div>';
  }
}

const trackerDelay = ms => new Promise(resolve => setTimeout(resolve, ms));
const RETRYABLE_TRACKER_STATUS = new Set([502, 503, 504]);

async function authedFetch(path){
  let lastError = null;
  // A Render restart or an expired Firebase token should not strand one user
  // on a blank Tracker while everyone else is working. Refresh the token and
  // retry short-lived network/server failures before surfacing an error.
  for(let attempt = 0; attempt < 3; attempt += 1){
    try{
      if(window.__refreshFirebaseIdToken) await window.__refreshFirebaseIdToken(attempt > 0);
      const headers = window.__sentientRolePreviewHeaders ? window.__sentientRolePreviewHeaders() : {};
      if(window.__firebaseIdToken) headers.Authorization = 'Bearer '+window.__firebaseIdToken;
      const r = await fetch(API+path, {headers});
      if(r.status===401||r.status===403){
        if(attempt < 2) {
          lastError = new Error('unauthorized');
          await trackerDelay(350 * (attempt + 1));
          continue;
        }
        window.__onInsightsUnauthorized && window.__onInsightsUnauthorized();
        throw new Error('unauthorized');
      }
      if(!r.ok){
        lastError = new Error('HTTP '+r.status);
        if(RETRYABLE_TRACKER_STATUS.has(r.status) && attempt < 2){
          await trackerDelay(500 * (attempt + 1));
          continue;
        }
        throw lastError;
      }
      return r.json();
    }catch(error){
      lastError = error;
      if(attempt < 2){
        await trackerDelay(500 * (attempt + 1));
        continue;
      }
    }
  }
  throw new Error(lastError?.message === 'Failed to fetch'
    ? 'Connection to the Tracker is still reconnecting. Try again in a moment.'
    : (lastError?.message || 'Could not load Tracker data.'));
}

async function authedPost(path){
  const headers = window.__sentientRolePreviewHeaders ? window.__sentientRolePreviewHeaders() : {};
  if(window.__firebaseIdToken) headers.Authorization = 'Bearer '+window.__firebaseIdToken;
  const r = await fetch(API+path, {method:'POST', headers});
  if(r.status===401||r.status===403){ window.__onInsightsUnauthorized && window.__onInsightsUnauthorized(); throw new Error('unauthorized'); }
  if(!r.ok){
    let detail = 'HTTP '+r.status;
    try{ const body = await r.json(); if(body && body.detail) detail = body.detail; }catch{}
    throw new Error(detail);
  }
  return r.json();
}

/* ---------------- Manual refresh (real-time follower count) ----------------
   Both actions cost real Apify calls (~$0.002 each), so they're explicit
   opt-in buttons rather than anything automatic -- the daily 7am snapshot
   already covers the "just keep this current" case for free. */
async function refreshAccountNow(handle, btn){
  // Spins just the &#8635; glyph, not the whole element -- the leaderboard's
  // button IS the glyph, but the detail page's button also has a "Refresh"
  // label next to it that shouldn't spin along with the icon.
  const icon = btn && (btn.querySelector('.refresh-icon') || btn);
  if(btn){ btn.disabled = true; }
  if(icon){ icon.classList.add('is-spinning'); }
  try{
    const result = await authedPost('/api/tracker/accounts/'+encodeURIComponent(handle)+'/refresh');
    const row = SUMMARY.accounts.find(r=>r.handle===handle);
    if(row){
      row.followers = result.followers;
      row.posts_count = result.posts_count;
      row.captured_at = result.captured_at;
      row.full_name = result.full_name;
      row.verified = result.verified;
      row.private = result.private;
    }
    // The detail page's chart/history is stale the instant a new snapshot
    // lands, so drop the cache rather than patch it -- it's a cheap re-fetch
    // (no Apify call) the next time this account's page is opened.
    delete DETAIL_CACHE[handle];
    render();
  }catch(e){
    alert('Could not refresh @'+handle+': '+(e.message||e));
  }finally{
    if(btn){ btn.disabled = false; }
    if(icon){ icon.classList.remove('is-spinning'); }
  }
}

async function refreshAllAccountsNow(btn){
  if(btn){ btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = 'Refreshing all…'; }
  try{
    await authedPost('/api/tracker/snapshot-now');
    DETAIL_CACHE = {};
    await loadSummary();
    render();
  }catch(e){
    alert('Could not refresh accounts: '+(e.message||e));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.label || '↻ Refresh all'; }
  }
}

async function loadSummary(){
  SUMMARY = await authedFetch('/api/tracker/summary');
}

/* ---------------- Favourites + sidebar ----------------
   Favourites live in localStorage rather than the database: this is a
   per-person "what am I watching today" shortlist, it needs to feel
   instant, and losing it costs nothing (the account is still tracked, it
   just isn't pinned). Everything that must survive a device change --
   which accounts exist, their history -- is already server-side. */
const FAV_KEY = 'sentient.tracker.favs';
// Stored as an ordered array (not just a Set) specifically so the
// Favourites list can be drag-reordered -- array order IS display order.
function readFavs(){
  try{ const v = JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); return Array.isArray(v)?v:[]; }
  catch{ return []; }
}
function writeFavs(list){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(list)); }catch{}
}
function toggleFav(handle){
  const favs = readFavs();
  const i = favs.indexOf(handle);
  if(i>=0) favs.splice(i,1); else favs.push(handle);
  writeFavs(favs);
  renderSidebar();
}
function reorderFavs(dragHandle, targetHandle){
  const favs = readFavs();
  const from = favs.indexOf(dragHandle);
  const to = favs.indexOf(targetHandle);
  if(from<0 || to<0 || from===to) return;
  favs.splice(from,1);
  favs.splice(to,0,dragHandle);
  writeFavs(favs);
  renderSidebar();
}

function renderSidebar(){
  if(!SUMMARY || !SUMMARY.accounts) return;
  const favsList = readFavs();
  const favs = new Set(favsList);
  const current = readAcc();
  const q = (window.__sidebarQuery||'').trim().toLowerCase();
  const match = r => !q || r.handle.toLowerCase().includes(q) || (r.full_name||'').toLowerCase().includes(q);

  // Grouped by category, favourites hoisted into their own group at the top
  // so the accounts you actually watch are always the first thing in reach.
  // Favourites keep the person's own drag-and-drop order; the other two
  // groups stay in the dashboard's default (follower-count) order.
  const all = SUMMARY.accounts.filter(match);
  const byHandle = new Map(all.map(r => [r.handle, r]));
  const favRows = favsList.map(h => byHandle.get(h)).filter(Boolean);
  const groups = [
    ['Favourites', favRows],
    ['Ours',       all.filter(r=>!favs.has(r.handle) && r.group==='sentient')],
    ['Competitors',all.filter(r=>!favs.has(r.handle) && r.group!=='sentient')],
  ];

  const item = (r, draggable) => {
    const d = r.delta_1d ? r.delta_1d.delta : null;
    const cls = d==null ? 'flat' : d>0 ? 'up' : d<0 ? 'down' : 'flat';
    return `<li class="side-item ${current===r.handle?'active':''}" data-handle="${r.handle}" ${draggable?'draggable="true"':''}>
      <button class="side-star ${favs.has(r.handle)?'on':''}" data-fav="${r.handle}"
              title="${favs.has(r.handle)?'Remove from favourites':'Add to favourites'}" aria-label="Toggle favourite">★</button>
      <img class="side-avatar" src="${API}/api/dashboard/avatar/${encodeURIComponent(r.handle)}"
           referrerpolicy="no-referrer" onerror="avFail(this,'${r.handle}')">
      <span class="side-name">
        <strong>@${r.handle}</strong>
        <em>${r.followers!=null?fmt(r.followers):'—'}</em>
      </span>
      <span class="side-delta ${cls}">${d==null?'':signed(d)}</span>
    </li>`;
  };

  $('#sidebar').innerHTML = `
    <div class="side-search">
      <input id="sideSearch" type="search" placeholder="Search accounts" value="${(window.__sidebarQuery||'').replace(/"/g,'&quot;')}">
    </div>
    <button class="side-all ${current?'':'active'}" id="sideAll">All accounts</button>
    ${groups.map(([label, rows]) => !rows.length ? '' : `
      <div class="side-group">
        <h3>${label} <span>${rows.length}</span></h3>
        <ul ${label==='Favourites'?'id="favList"':''}>${rows.map(r=>item(r, label==='Favourites')).join('')}</ul>
      </div>`).join('')}
  `;

  $('#sideAll').onclick = () => { writeAcc(''); render(); };
  $('#sidebar').querySelectorAll('[data-fav]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    toggleFav(b.dataset.fav);
  });
  $('#sidebar').querySelectorAll('.side-item').forEach(li => li.onclick = () => {
    writeAcc(li.dataset.handle); render();
  });

  // Drag-and-drop reordering, scoped to the Favourites list only -- Ours and
  // Competitors stay in their normal order since nothing about them is
  // personal to one viewer the way a shortlist is.
  const favList = $('#favList');
  if(favList){
    let dragHandle = null;
    favList.querySelectorAll('.side-item').forEach(li => {
      li.addEventListener('dragstart', e => {
        dragHandle = li.dataset.handle;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragHandle);
        li.classList.add('dragging');
      });
      li.addEventListener('dragend', () => {
        li.classList.remove('dragging');
        favList.querySelectorAll('.side-item').forEach(el => el.classList.remove('drag-over'));
      });
      li.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if(li.dataset.handle !== dragHandle) li.classList.add('drag-over');
      });
      li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
      li.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        li.classList.remove('drag-over');
        if(dragHandle) reorderFavs(dragHandle, li.dataset.handle);
      });
    });
  }

  const search = $('#sideSearch');
  search.oninput = () => {
    window.__sidebarQuery = search.value;
    renderSidebar();
    // Re-rendering blows away focus, so put the caret back where it was.
    const next = $('#sideSearch');
    next.focus();
    next.setSelectionRange(next.value.length, next.value.length);
  };
}

function render(){
  const acc = readAcc();
  renderSidebar();
  if(acc) renderDetail(acc);
  else renderLeaderboard();
}

/* ---------------- Leaderboard ---------------- */
let sortKey='followers', sortDir=-1;

function trackingSinceNote(){
  if(!SUMMARY.tracking_since) return `<div class="note">No follower history recorded yet -- the first daily snapshot runs at 7am CST, or use <b>Settings → System</b> to capture one right now. Growth columns fill in day by day from there; there's no way to recover Instagram's past follower counts for an account that just started being tracked.</div>`;
  const days = Math.max(1, Math.round((Date.now()-new Date(SUMMARY.tracking_since).getTime())/864e5));
  return `<div class="note">Tracking since <b>${new Date(SUMMARY.tracking_since).toLocaleDateString()}</b> (${days} day${days===1?'':'s'} of history so far). Follower deltas need that many days of snapshots to fill in -- a fresh account naturally shows "—" for windows it hasn't lived through yet.</div>`;
}

function renderLeaderboard(){
  destroyCharts();
  const rows = [...SUMMARY.accounts];
  const val = r => {
    if(sortKey==='handle') return r.handle;
    if(sortKey==='followers') return r.followers ?? -1;
    if(sortKey==='delta_1d') return r.delta_1d?.delta ?? -Infinity;
    if(sortKey==='delta_7d') return r.delta_7d?.delta ?? -Infinity;
    if(sortKey==='delta_30d') return r.delta_30d?.delta ?? -Infinity;
    if(sortKey==='posts_count') return r.posts_count ?? -1;
    if(sortKey==='avg_likes_30d') return r.avg_likes_30d ?? -Infinity;
    if(sortKey==='engagement_trend_pct') return r.engagement_trend_pct ?? -Infinity;
    if(sortKey==='captured_at') return r.captured_at ? new Date(r.captured_at).getTime() : -Infinity;
    return 0;
  };
  rows.sort((a,b)=>{
    const va=val(a), vb=val(b);
    if(typeof va==='string') return va.localeCompare(vb)*sortDir*-1;
    return (vb-va)*(sortDir<0?1:-1);
  });

  const withFollowers = rows.filter(r=>r.followers!=null).length;
  const trackedAll = SUMMARY.accounts.length;

  const cols = [
    ['rank','#'], ['handle','Account'], ['followers','Followers'],
    ['delta_1d','1 day'], ['delta_7d','7 days'], ['delta_30d','30 days'],
    ['posts_count','Posts'], ['avg_likes_30d','Avg likes (30d)'], ['engagement_trend_pct','Engagement trend'],
    ['captured_at','Last snapshot'],
  ];

  const deltaCell = d => {
    if(!d) return '<span class="na">—</span>';
    const cls = d.delta>0?'up':d.delta<0?'down':'flat';
    return `<span class="delta ${cls}">${signed(d.delta)}</span> <span class="na">${pct(d.pct)}</span>`;
  };

  $('#app').innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>Accounts tracked</b><strong>${trackedAll}</strong><em>${withFollowers} with follower data</em></div>
      <div class="kpi"><b>Leader</b><strong>${rows[0]&&rows[0].followers!=null?'@'+rows[0].handle:'—'}</strong><em>${rows[0]&&rows[0].followers!=null?fmt(rows[0].followers)+' followers':'no data yet'}</em></div>
      <div class="kpi"><b>Top 7d grower</b><strong>${(()=>{const g=[...rows].filter(r=>r.delta_7d).sort((a,b)=>b.delta_7d.delta-a.delta_7d.delta)[0]; return g?'@'+g.handle:'—';})()}</strong><em>${(()=>{const g=[...rows].filter(r=>r.delta_7d).sort((a,b)=>b.delta_7d.delta-a.delta_7d.delta)[0]; return g?signed(g.delta_7d.delta)+' in 7d':'not enough history yet';})()}</em></div>
    </div>

    <section>
      <div class="section-head">
        <h2>Leaderboard <span class="tag">all tracked accounts</span></h2>
        <button type="button" class="linkbtn refresh-btn" id="refreshAllBtn" title="Re-scrape every account's real follower count from Instagram right now (~$0.002 each)">&#8635; Refresh all</button>
      </div>
      <p class="sub">Ranked by followers by default -- click any column to re-sort. Click a row to open its growth chart. "Engagement trend" compares this month's average likes to the previous month, from post history we already have. The &#8635; next to a follower count re-scrapes just that account.</p>
      ${trackingSinceNote()}
      <div style="overflow-x:auto;margin-top:12px">
      <table id="tLeaderboard">
        <thead><tr>${cols.map(([k,l])=>`<th data-k="${k}" class="${sortKey===k?'sorted':''}">${l}</th>`).join('')}</tr></thead>
        <tbody>${rows.map((r,i)=>`
          <tr data-handle="${r.handle}">
            <td class="rank-num">${r.rank_by_followers ?? '—'}</td>
            <td><div class="acct-cell">
              <img class="acct-avatar" src="${API}/api/dashboard/avatar/${encodeURIComponent(r.handle)}" referrerpolicy="no-referrer" onerror="avFail(this,'${r.handle}')">
              <div class="acct-name"><strong>@${r.handle}${r.verified?' <span title="Verified" style="color:#4aa8ff">✓</span>':''}${r.private?' <span class="na" title="Private account">🔒</span>':''}</strong>
                <span class="na" style="font-size:10px">${r.full_name && r.full_name.toLowerCase()!==r.handle.toLowerCase() ? r.full_name : ' '}</span>
                <span class="pill ${r.group==='sentient'?'s':'c'}">${r.group==='sentient'?'ours':'competitor'}</span>
              </div>
            </div></td>
            <td><span class="followers-cell">${r.followers!=null?fmt(r.followers):'<span class="na">—</span>'}<button type="button" class="row-refresh-btn" data-refresh="${r.handle}" title="Refresh @${r.handle}&#39;s real follower count now"><span class="refresh-icon">&#8635;</span></button></span></td>
            <td>${deltaCell(r.delta_1d)}</td>
            <td>${deltaCell(r.delta_7d)}</td>
            <td>${deltaCell(r.delta_30d)}</td>
            <td>${r.posts_count!=null?fmt(r.posts_count):'<span class="na">—</span>'}</td>
            <td>${r.avg_likes_30d!=null?fmt(r.avg_likes_30d)+' <span class="na">('+ (r.posts_30d||0) +' posts)</span>':'<span class="na">—</span>'}</td>
            <td>${r.engagement_trend_pct!=null?pct(r.engagement_trend_pct):'<span class="na">—</span>'}</td>
            <td>${r.captured_at?`<span class="na" title="${dt(r.captured_at)}">${new Date(r.captured_at).toLocaleDateString()}</span>`:'<span class="na">—</span>'}</td>
          </tr>`).join('')}</tbody>
      </table>
      </div>
    </section>
  `;

  $('#tLeaderboard').querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(k==='rank') return;
    sortDir = sortKey===k ? -sortDir : -1; sortKey=k; renderLeaderboard();
  });
  $('#tLeaderboard').querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{
    writeAcc(tr.dataset.handle); render();
  });
  $('#tLeaderboard').querySelectorAll('[data-refresh]').forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation();
    refreshAccountNow(btn.dataset.refresh, btn);
  });
  $('#refreshAllBtn').onclick = (e) => refreshAllAccountsNow(e.currentTarget);
}

/* ---------------- Historical stats table ---------------- */
function histPill(curr, prev, isPct){
  if(curr==null || prev==null) return '';
  const diff = curr - prev;
  if(Math.abs(diff) < (isPct?0.005:1)) return '';
  const cls = diff>0?'up':'down';
  const text = isPct ? (diff>0?'+':'')+diff.toFixed(2)+'%' : signed(Math.round(diff));
  return `<span class="hist-pill ${cls}">${text}</span>`;
}

// Manual refreshes can add several snapshots on the same calendar day (the
// 7am job plus however many times someone hits the refresh button), but a
// "day" in the table/chart should read as one settled total, not one row
// per refresh. Collapsing to each day's LAST snapshot keeps the most
// current number for that day while showing exactly one point per day --
// hist is already oldest -> newest, so later entries simply overwrite
// earlier ones for the same day in this Map, and insertion order (first
// time each day is seen) keeps the result chronological.
function collapseToLastPerDay(hist){
  const byDay = new Map();
  for(const h of hist) byDay.set(new Date(h.date).toDateString(), h);
  return [...byDay.values()];
}

function renderHistoricalStats(hist){
  if(!hist.length) return '<div class="empty">No snapshots yet.</div>';
  // Oldest at the top, newest at the bottom -- reading downwards follows the
  // account forwards in time, which is how Social Blade presents it and how
  // people actually read a run of daily numbers.
  const rows = collapseToLastPerDay(hist).slice(-15);
  const rateOf = h => (h.avg_likes_that_day!=null && h.followers) ? h.avg_likes_that_day/h.followers*100 : null;
  const dailyDelta = (curr, prev) =>
    (prev && curr.followers!=null && prev.followers!=null) ? curr.followers-prev.followers : null;
  return `
    <div style="overflow-x:auto">
    <table class="hist-table">
      <thead><tr>
        <th>Date</th>
        <th>Followers +/-</th>
        <th class="hist-secondary">Total followers</th>
        <th>Following</th>
        <th>Media</th>
        <th>Engagement rate</th>
      </tr></thead>
      <tbody>${rows.map((h,i)=>{
        const prev = rows[i-1]; // rows run oldest -> newest, so the previous day is behind us
        const d = new Date(h.date);
        const dateLabel = d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
        const dow = d.toLocaleDateString(undefined,{weekday:'short'});
        const rate = rateOf(h), prevRate = prev?rateOf(prev):null;
        const delta = dailyDelta(h, prev);
        const deltaCls = delta==null ? 'flat' : delta>0 ? 'up' : delta<0 ? 'down' : 'flat';
        return `<tr>
          <td><span class="hist-date">${dateLabel}</span><span class="hist-dow">${dow}</span></td>
          <td><span class="hist-daily ${deltaCls}">${delta==null?'—':signed(delta)}</span></td>
          <td class="hist-secondary"><span class="hist-total">${h.followers!=null?fmt(h.followers):'—'}</span></td>
          <td><span class="hist-val">${h.following_count!=null?fmt(h.following_count):'—'}</span>${prev?histPill(h.following_count, prev.following_count, false):''}</td>
          <td><span class="hist-val">${h.posts_count!=null?fmt(h.posts_count):'—'}</span>${prev?histPill(h.posts_count, prev.posts_count, false):''}</td>
          <td><span class="hist-val">${rate!=null?rate.toFixed(2)+'%':'<span class=\"na\">—</span>'}</span>${(prev&&rate!=null)?histPill(rate, prevRate, true):''}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    </div>
  `;
}

// Same Firebase project/config as the main dashboard (src/App.jsx) and

import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';

  apiKey: 'AIzaSyDrtLGrnRJ3cj64sJ6Ykn-yRGtemybzoN0',

};
const auth = getAuth(initializeApp(firebaseConfig));
// Explicitly match the Dashboard's local Firebase persistence before trying
// the shared SSO cookie. Without this, a restored session can race the static
// page's login gate and make Tracker look signed out while it is still loading.
const authPersistenceReady = setPersistence(auth, browserLocalPersistence).catch(() => null);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

// Single sign-on across *.sentientdash.app -- see src/sso.js for the full
// writeup. This is a vanilla-JS copy of the same cookie bootstrap since this
// page is a standalone static file, not part of the Vite React bundle.
const SSO_API = 'https://cortex-api-db2e.onrender.com';
const SSO_COOKIE = 'sentient_sso';
function ssoCookieDomain() { return location.hostname.endsWith('sentientdash.app') ? '.sentientdash.app' : ''; }
function ssoReadCookie() {
  const match = document.cookie.match(new RegExp('(?:^|; )' + SSO_COOKIE + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

  const domain = ssoCookieDomain();

async function ssoPublishCookie() {
  const user = auth.currentUser;

  try {
    const idToken = await user.getIdToken();
    const response = await fetch(SSO_API + '/api/auth/custom-token', { method: 'POST', headers: { Authorization: 'Bearer ' + idToken } });

    const body = await response.json();

  await authPersistenceReady;
  if (auth.currentUser) return true;
  const token = ssoReadCookie();
  if (!token) return false;

    await signInWithCustomToken(auth, token);
    return true;
  } catch (err) {
    ssoClearCookie();

  ssoPublishCookie();

// won't give us a popup, which is the common case on mobile.
const POPUP_FALLBACK_CODES = new Set([
  'auth/popup-blocked',
  'auth/operation-not-supported-in-this-environment',
  'auth/web-storage-unsupported',
  'auth/internal-error',
]);

async function startSignIn() {
  try {
    await signInWithPopup(auth, provider);
    return null;
  } catch (err) {
    const code = err?.code || '';
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return null;
    if (POPUP_FALLBACK_CODES.has(code)) {
      await signInWithRedirect(auth, provider);
      return null;
    }
    return err;
  }

function describeSignInError(err) {
  const code = err?.code || '';
  if (code === 'auth/unauthorized-domain') {
    return 'This domain (' + location.hostname + ') isn’t authorized in Firebase yet.';
  }
  if (code === 'auth/network-request-failed') {
    return 'Network error reaching Google. Check your connection and try again.';
  }
  return code ? 'Sign-in failed (' + code + '). Try again.' : 'Sign-in failed. Try again.';

const gate = document.getElementById('authGate');
const gateText = document.getElementById('authGateText');
const gateBtn = document.getElementById('authGateBtn');
let booted = false;

window.__onInsightsUnauthorized = () => {
  gateText.textContent = (auth.currentUser?.email || 'This Google account') + ' isn’t authorized for sentientdash.app.';
  gateBtn.textContent = 'Sign out';
  gateBtn.onclick = () => { ssoClearCookie(); signOut(auth); };
  gate.classList.remove('hidden');
};

// The Settings panel's sign-out button lives in a classic <script> below,
// outside this module's scope -- expose a global the same way as the other
// __-prefixed bridges on this page.
window.__signOut = () => { ssoClearCookie(); signOut(auth); };

// Picks the user back up when the redirect fallback returns them here.
getRedirectResult(auth).catch((err) => { gateText.textContent = describeSignInError(err); });

function showSignInGate() {
  gateText.textContent = 'Sign in with your Google account to continue.';
  gateBtn.textContent = 'Sign in with Google';
  gateBtn.onclick = runSignIn;
  gate.classList.remove('hidden');
}

// Same-session-everywhere: try the shared cookie (minted by the main
// dashboard or Queue board) before ever showing the Google gate here. If it
// turns out there was no cookie (or it didn't work), and Firebase still
// hasn't produced a signed-in user by the time the check finishes, show the
// gate ourselves -- onAuthStateChanged won't fire again on its own if the
// state never actually changed.
let ssoChecked = false;

async function runSignIn() {
  gateBtn.disabled = true;
  const err = await startSignIn();
  if (err) gateText.textContent = describeSignInError(err);
  gateBtn.disabled = false;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    booted = false;
    if (!ssoChecked) return; // give the silent cookie sign-in a chance first
    showSignInGate();
    return;
  }
  window.__refreshFirebaseIdToken = async (forceRefresh = false) => {
    const token = await auth.currentUser?.getIdToken(forceRefresh);
    if (token) window.__firebaseIdToken = token;
    return token || '';
  };
  await window.__refreshFirebaseIdToken();
  window.__signedInEmail = user.email || '';
  setSettingsAvatar(user);
  gate.classList.add('hidden');
  ssoStartRefresh();
  if (!booted) {
    booted = true;
    window.__startInsightsBoot();
  }
});

// Register the Firebase observer first. A custom-token sign-in can complete
// very quickly; observing before starting it guarantees the app receives that
// state transition and starts the Tracker instead of leaving the page gated.
ssoTrySignIn().finally(() => {
  ssoChecked = true;
  if (!auth.currentUser) showSignInGate();
});
</script>

/* --- language + theme -------------------------------------------------

const PREF_LANG = 'sentient.lang', PREF_THEME = 'sentient.theme';
const ES = {"Copy link": "Copiar link", "Dashboard": "Dashboard", "Insights": "Insights", "Tracker": "Tracker", "Sign in with your Google account to continue.": "Iniciá sesión con tu cuenta de Google para continuar.", "Sign in with Google": "Iniciar sesión con Google", "Sign out": "Cerrar sesión", "Copy a link to this exact view": "Copiar link a esta vista exacta", "Loading…": "Cargando…", "Loading...": "Cargando...", "Toggle theme": "Cambiar tema", "Language": "Idioma", "Accounts tracked": "Cuentas seguidas", "Leader": "Líder", "Top 7d grower": "Mayor crecimiento 7d", "Leaderboard": "Tabla de posiciones", "All tracked accounts": "Todas las cuentas seguidas", "Search accounts": "Buscar cuentas", "All accounts": "Todas las cuentas", "Favourites": "Favoritos", "Ours": "Nuestras", "Competitors": "Competidores", "Account": "Cuenta", "Followers": "Seguidores", "Posts": "Posts", "1 day": "1 día", "7 days": "7 días", "30 days": "30 días", "Avg likes (30d)": "Likes prom. (30d)", "Engagement trend": "Tendencia de engagement", "Last snapshot": "Última captura", "with follower data": "con datos de seguidores", "followers": "seguidores", "Historical stats": "Estadísticas históricas", "Total followers": "Seguidores totales", "Date": "Fecha", "Settings": "Ajustes", "Accent color": "Color de acento", "Theme": "Tema", "Dark": "Oscuro", "Light": "Claro", "Admin": "Admin", "Open full settings": "Abrir Settings completo"};

/* --- Settings panel: accent, theme, language, admin link, sign out ------

const PREF_ACCENT = 'sentient.accent';

  const custom = document.getElementById('settingsCustomColor');
  if (custom) custom.value = accentHex(normalized);
}
setAccent(readAccent());
document.querySelectorAll('#settingsAccentPicker button').forEach((b) => {
  b.addEventListener('click', () => setAccent(b.dataset.accentChoice));
});
document.getElementById('settingsCustomColor')?.addEventListener('input', (event) => setAccent(event.target.value));
document.querySelectorAll('#settingsThemeSegment button').forEach((b) => {
  b.addEventListener('click', () => { setTheme(b.dataset.themeChoice); setAccent(readAccent()); });
});
window.addEventListener('storage', (event) => { if (event.key === PREF_ACCENT) setAccent(readAccent()); });

const settingsMenu = document.getElementById('settingsMenu');
const settingsTrigger = document.getElementById('settingsTrigger');
const settingsPanel = document.getElementById('settingsPanel');
function setSettingsAvatar(user) {
  const initial = (user?.email || '?').trim().charAt(0).toUpperCase();
  settingsTrigger.replaceChildren();
  if (user?.photoURL) {
    const image = document.createElement('img');
    image.alt = '';
    image.referrerPolicy = 'no-referrer';
    image.src = user.photoURL;
    image.onerror = () => { settingsTrigger.replaceChildren(Object.assign(document.createElement('span'), { textContent: initial })); };
    settingsTrigger.append(image);
  } else settingsTrigger.append(Object.assign(document.createElement('span'), { textContent: initial }));
}
function closeSettings() {
  settingsPanel.classList.remove('is-open');
  settingsTrigger.classList.remove('is-active');
  settingsTrigger.setAttribute('aria-expanded', 'false');
}
let adminChecked = false;
function checkAdminForSettings() {
  // Deferred until the panel is actually opened (rather than on page load)
  // so this never races the sign-in flow and fires __onInsightsUnauthorized
  // before Firebase has produced a token.
  if (adminChecked || !window.__firebaseIdToken) return;
  adminChecked = true;
  authedFetch('/api/dashboard/me').then((me) => {
    const isAdmin = Boolean(me && (me.is_admin || me.is_dev || (Array.isArray(me.operating_roles) && me.operating_roles.includes('admin')) || me.operating_role === 'admin'));
    document.getElementById('settingsAdmin').classList.toggle('is-visible', isAdmin);
  }).catch(() => { adminChecked = false; });
}
function openSettings() {
  document.getElementById('settingsEmail').textContent = window.__signedInEmail || '';
  settingsPanel.classList.add('is-open');
  settingsTrigger.classList.add('is-active');
  settingsTrigger.setAttribute('aria-expanded', 'true');
  checkAdminForSettings();
}
settingsTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  if (settingsPanel.classList.contains('is-open')) closeSettings(); else openSettings();
});
document.addEventListener('click', (e) => {
  if (!settingsMenu.contains(e.target)) closeSettings();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSettings();
});
document.getElementById('settingsSignOut').addEventListener('click', () => {
  closeSettings();
  window.__signOut && window.__signOut();
});

// Admin-only "Open full settings" link -- best-effort: if the check fails
// (offline, not booted yet) the section just stays hidden.
authedFetch('/api/dashboard/me').then((me) => {
  const isAdmin = Boolean(me && (me.is_admin || me.is_dev || (Array.isArray(me.operating_roles) && me.operating_roles.includes('admin')) || me.operating_role === 'admin'));
  document.getElementById('settingsAdmin').classList.toggle('is-visible', isAdmin);
}).catch(() => {});

</script>
</body>

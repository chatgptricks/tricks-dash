<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media kit</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/client.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">Media kit</p><h1 id="name">Cargando perfil</h1><p id="bio"></p><a id="profile" hidden>Ver perfil de Instagram</a></header>
    <p id="status" role="status" aria-live="polite">Consultando datos</p>
    <div id="content" hidden>
      <section aria-labelledby="audience-title"><h2 id="audience-title">Audiencia y rendimiento</h2><p class="muted">Rendimiento de los posts públicos analizados</p><dl id="metrics" class="metrics"></dl><p id="freshness" class="muted"></p></section>
      <section id="recent" hidden><h2>Últimos 30 días</h2><dl id="recent-metrics" class="metrics"></dl></section>
      <section><h2>Posts destacados</h2><div id="best-posts" class="posts"></div></section>
      <section><h2>Publicaciones recientes</h2><div id="posts" class="posts"></div><p id="posts-status" class="muted"></p></section>
      <section><h2>Historial de seguidores</h2><p class="muted">Muestras guardadas por el dashboard</p><div class="table-wrap"><table><thead><tr><th scope="col">Fecha</th><th scope="col">Seguidores</th></tr></thead><tbody id="history"></tbody></table></div><p id="history-status" class="muted"></p></section>
    </div>
  </main>
</body>
</html>
